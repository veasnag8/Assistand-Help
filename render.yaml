services:
  - type: web
    name: aisupport-video-server
    env: node
    plan: free
    buildCommand: npm install && python -m pip install --user -U "yt-dlp[default]"
    startCommand: npm run dev:video
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VIDEO_SERVER_HOST
        value: 0.0.0.0
      - key: VIDEO_SERVER_PORT
        value: "10000"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_ENABLED
        value: "true"
      - key: RENDER_WAKE_PING_ENABLED
        value: "true"
      - key: RENDER_WAKE_PING_INTERVAL_MS
        value: "600000"
      - key: YTDLP_JS_RUNTIMES
        value: node
      - key: YTDLP_REMOTE_COMPONENTS
        value: ejs:github
      - key: YTDLP_COOKIES_BASE64
        sync: false
